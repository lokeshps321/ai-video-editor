name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  timeline-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify browser availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:timeline-v2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-v2-results
          path: |
            frontend/artifacts/timeline-v2-result.json
            frontend/test-results/playwright
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/config.py backend/app/main.py backend/app/routers/transcript.py backend/app/transcription_service.py
      # Focused timeline gates for kratos; full suite still has unrelated legacy failures.
      - run: pytest backend/tests/test_timeline_service.py backend/tests/test_timeline_routes.py backend/tests/test_timeline_version_migration.py -q
