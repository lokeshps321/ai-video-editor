name: deploy-to-azure

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m py_compile backend/app/config.py backend/app/main.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$AZURE_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key "$AZURE_VM_USER@$AZURE_VM_HOST" << 'EOSSH'
          set -e
          echo "Deploying ClipMind..."

          # Pull latest code
          cd /root/ai-video-editor
          git fetch origin
          git reset --hard origin/main
          echo "✓ Code updated"

          # Build frontend
          cd /root/ai-video-editor/frontend
          npm install
          npm run build
          echo "✓ Frontend built"

          # Restart services
          systemctl restart clipmind-backend.service
          systemctl restart clipmind-frontend.service
          sleep 3

          # Verify services
          if systemctl is-active --quiet clipmind-backend.service && systemctl is-active --quiet clipmind-frontend.service; then
            echo "✓ Services restarted successfully"
          else
            echo "✗ Service restart failed"
            systemctl status clipmind-backend.service clipmind-frontend.service
            exit 1
          fi
          EOSSH

          echo "✓ Deployment complete!"
