services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipmind}
      POSTGRES_USER: ${POSTGRES_USER:-clipmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - clipmind_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env.production
    environment:
      UPLOAD_DIR: /app/uploads
      RENDER_DIR: /app/renders
      TMP_DIR: /app/tmp
    volumes:
      - clipmind_uploads:/app/uploads
      - clipmind_renders:/app/renders
      - clipmind_tmp:/app/tmp
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  clipmind_postgres:
  clipmind_uploads:
  clipmind_renders:
  clipmind_tmp:
