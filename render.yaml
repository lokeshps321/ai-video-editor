services:
  - type: web
    name: ai-video-editor-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Render's normal filesystem is erased on deploy/restart. Keep the
    # database, uploaded source videos, render previews, and async job payloads
    # under one persistent mount so a user's project can be reopened intact.
    disk:
      name: clipmind-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: RENDER_DIR
        value: /var/data/renders
      - key: TMP_DIR
        value: /var/data/tmp
      - key: STORAGE_BACKEND
        value: local
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"

crons:
  - id: health-check
    service: ai-video-editor-backend
    schedule: "*/5 * * * *"
    httpPath: /health
